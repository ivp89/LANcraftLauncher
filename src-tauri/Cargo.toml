[package]
name = "lancraft-launcher"
version = "0.1.0"
description = "LANCRAFT Launcher - custom LANCommander client"
authors = []
edition = "2021"

[lib]
name = "lancraft_launcher_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lancraft-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
zip = { version = "2", default-features = false, features = ["deflate-zlib"] }
futures-util = "0.3"
dirs = "5"
crc32fast = "1"
display-info = "0.5"
tauri-plugin-log = "2"
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
